services:
  redis-node1:
    image: redis:7.2.4
    container_name: redis-node1
    user: root
    command: redis-server /data/redis.conf
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.11
    ports:
      - '7100:7100'
      - '17100:17100'
    volumes:
      - ./data/node1:/data
      - ./conf/redis-node1.conf:/data/redis.conf

  redis-node2:
