services:
  redis:
    image: redis:alpine
    container_name: redis-local
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    restart: unless-stopped

volumes:
  redis_data:
